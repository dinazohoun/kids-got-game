<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: scoreboard ledger — sticky club header, tab rail, one column of match rows; dark gym-scoreboard first, light variant */
:root{
  --bg:#EEF3F8;--surface:#FFFFFF;--surface-2:#E3EBF4;--line:#CCD8E5;
  --fg:#0B2C5B;--muted:#55708F;--accent:#1C82C2;--accent-ink:#FFFFFF;
  --cream:#0B2C5B;--live:#D7263D;--win:#0B2C5B;--gold:#A9790B;--warn-bg:#FFF4D6;--warn-fg:#6B4E00;
  --head-bg:#0B2C5B;--head-fg:#F3EBD8;--head-muted:#A9C7E4;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06142A;--surface:#0D2244;--surface-2:#132D57;--line:#1F3D6B;
  --fg:#EAF1F8;--muted:#8FA9C8;--accent:#5BC0EB;--accent-ink:#06142A;
  --cream:#F3EBD8;--live:#FF5A6A;--win:#F3EBD8;--gold:#E8B73A;--warn-bg:#3A2E0B;--warn-fg:#F6DA8A;
  --head-bg:#030C1C;--head-fg:#F3EBD8;--head-muted:#8FA9C8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06142A;--surface:#0D2244;--surface-2:#132D57;--line:#1F3D6B;
  --fg:#EAF1F8;--muted:#8FA9C8;--accent:#5BC0EB;--accent-ink:#06142A;
  --cream:#F3EBD8;--live:#FF5A6A;--win:#F3EBD8;--gold:#E8B73A;--warn-bg:#3A2E0B;--warn-fg:#F6DA8A;
  --head-bg:#030C1C;--head-fg:#F3EBD8;--head-muted:#8FA9C8;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-fg)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.top img{width:44px;height:auto;flex:none}
.brand{min-width:0;flex:1}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.04em;line-height:1;margin:0;text-transform:uppercase}
.brand p{margin:3px 0 0;font-size:.8rem;color:var(--head-muted)}
.stamp{font-size:.72rem;color:var(--head-muted);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.stamp b{display:block;color:var(--head-fg);font-family:var(--f-display);font-size:1rem;letter-spacing:.03em}
nav.tabs{background:var(--head-bg);border-top:1px solid rgba(255,255,255,.08)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:0;scrollbar-width:none}
nav.tabs a{flex:none;display:block;padding:10px 12px 9px;color:var(--head-muted);text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--head-fg);border-bottom-color:var(--accent)}
nav.tabs a.ed{color:var(--accent)}
main{padding-block:18px 120px}
.view{display:grid;gap:22px}
#diag{margin-bottom:16px}
h2.sec{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2.sec small{font-family:var(--f-body);font-weight:500;font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.note{font-size:.82rem;color:var(--muted);margin:8px 2px 0}
/* match rows */
.row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .when{font-family:var(--f-display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.1}
.row .when small{display:block;font-family:var(--f-body);font-weight:500;font-size:.7rem;color:var(--muted)}
.pair{min-width:0;display:grid;gap:2px}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .nm.ph{color:var(--muted);font-style:italic}
.side .sc{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.side.w .nm{font-weight:700;color:var(--win)}
.side.l .sc,.side.l .nm{color:var(--muted)}
.pill{font-family:var(--f-display);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{border-color:var(--live);color:var(--live)}
.pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;animation:blink 1.2s infinite}
.pill.fin{background:var(--surface-2);color:var(--fg);border-color:transparent}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* scoreboards */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.board{background:var(--head-bg);color:var(--head-fg);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;border:1px solid var(--line)}
.board .meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--head-muted);text-transform:uppercase;letter-spacing:.06em}
.board .meta .live{color:var(--live);font-weight:700}
.board .line{display:flex;align-items:center;gap:10px}
.board .line .nm{flex:1;min-width:0;font-weight:600;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .line .sc{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:.95;font-variant-numeric:tabular-nums;color:var(--gold);min-width:2.2ch;text-align:right}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.hero{background:var(--head-bg);color:var(--head-fg);border-radius:var(--r);padding:22px 18px;display:grid;gap:6px;text-align:center}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.hero p{margin:0;color:var(--head-muted)}
/* standings */
.tscroll{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.st th{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line)}
table.st td{text-align:center;padding:9px 6px;border-top:1px solid var(--line)}
table.st td.tm,table.st th.tm{text-align:left;white-space:nowrap}
table.st td.rk{font-family:var(--f-display);font-weight:800;font-size:1.1rem;width:34px}
table.st td.pts{font-weight:700}
table.st tr.q td.rk{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:0}
.legend i.o{background:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.grid2>*{min-width:0}
/* ranking */
ol.rank{list-style:none;margin:0;padding:0}
ol.rank li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-top:1px solid var(--line)}
ol.rank li:first-child{border-top:0}
ol.rank .p{font-family:var(--f-display);font-weight:800;font-size:1.2rem;width:2.2ch;color:var(--muted)}
ol.rank li:nth-child(-n+3) .p{color:var(--gold)}
/* rules */
dl.rules{margin:0;display:grid;grid-template-columns:minmax(120px,38%) 1fr}
dl.rules dt,dl.rules dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
dl.rules dt{color:var(--muted);font-size:.85rem}
dl.rules dt:first-of-type,dl.rules dd:first-of-type{border-top:0}
dl.rules dd{font-weight:600}
/* admin */
.banner{background:var(--warn-bg);color:var(--warn-fg);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.acard.dirty{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.acard .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.acard .hd b{font-family:var(--f-display);font-size:1rem;color:var(--fg);letter-spacing:.04em}
.aline{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.aline .nm{min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl{display:flex;align-items:center;gap:4px}
.ctrl button{min-width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-family:var(--f-display);font-size:1.05rem}
.ctrl button.plus{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ctrl input{width:56px;height:40px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.35rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button.live[aria-pressed="true"]{background:var(--live);color:#fff}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:12px}
.fields label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fields input,.wide input{font:inherit;font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.wide{padding:12px;display:grid;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dng{background:transparent;color:var(--live);border-color:var(--live)}
.btn:disabled{opacity:.45;cursor:default}
.pubbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--head-bg);color:var(--head-fg);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 18px rgba(0,0,0,.25)}
.pubbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.pubbar .msg{flex:1;min-width:150px;font-size:.9rem}
.pubbar .btn{border-color:rgba(255,255,255,.2);background:transparent;color:var(--head-fg)}
.pubbar .btn.pri{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px}
/* poster */
.poster{display:grid;gap:12px;justify-items:center}
.poster canvas{width:min(100%,420px);height:auto;border-radius:var(--r);border:1px solid var(--line)}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;word-break:break-all;background:var(--surface-2);padding:8px 10px;border-radius:8px;user-select:all}
footer.foot{text-align:center;color:var(--muted);font-size:.78rem;padding-block:10px 30px}
@media (max-width:480px){
  .brand h1{font-size:1.3rem}.top img{width:36px}
  .row{grid-template-columns:48px 1fr auto;gap:8px;padding:9px 10px}
  .board .line .sc{font-size:2.2rem}
  .ctrl button{min-width:36px}.ctrl input{width:48px}
}
/* supabase version */
.login{display:grid;gap:12px;padding:16px;max-width:420px}
.login label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.login input{font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--head-muted);margin-right:5px;vertical-align:0}
.dot.ok{background:#3DDC84}.dot.off{background:var(--live)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline}
.pubbar.err{background:var(--live)}
footer.foot a{color:var(--muted)}
.efields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.efields label{display:grid;gap:3px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.efields .full{grid-column:1/-1}
.efields input,.efields select,.trow input,.trow select{font:inherit;font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%;min-width:0}
.trow{display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.tconf{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
section>.tools{padding:10px 0 0}
.btn.icon{width:40px;height:40px;padding:0;font-size:1.3rem;line-height:1}
.aline .nm.ph{color:var(--muted);font-style:italic;font-weight:500}
.acard .hd span{display:flex;gap:10px;align-items:center}
.panel.wide b{font-size:1rem}
</style>
<script src="config.js"></script>
</head>

/* ===== Calculs ===== */
function mList(S,kind){ return Object.keys(S.matches).map(function(id){ var m=S.matches[id]; return Object.assign({id:id},m); })
  .filter(function(m){ return !kind||m.k===kind; })
  .sort(function(x,y){ var a=x.t||"99:99",b=y.t||"99:99"; return a<b?-1:a>b?1:((x.o||0)-(y.o||0)); }); }
function done(m){ return m.s==="fin" && m.hs!=null && m.as!=null; }
function winSide(m){ if(!done(m)||m.hs===m.as) return null; return m.hs>m.as?"h":"a"; }
function teamName(S,id){ var t=S.teams[id]; return t?((t.nom||"").trim()||"Équipe sans nom"):null; }
function teamList(S){ return Object.keys(S.teams).map(function(id){ return Object.assign({id:id},S.teams[id]); })
  .sort(function(x,y){ return (x.poule||"").localeCompare(y.poule||"")||((x.o||0)-(y.o||0))||(x.id<y.id?-1:1); }); }
function poulesOf(S){ var p={}; teamList(S).forEach(function(t){ if(t.poule) p[t.poule]=1; }); return Object.keys(p).sort(); }

function sides(S,m){
  if(m.k==="duel") return {h:m.hn?{name:m.hn}:{name:"Joueur à désigner",ph:true}, a:m.an?{name:m.an}:{name:"Joueur à désigner",ph:true}};
  function one(id,ph){ var n=id&&teamName(S,id); return n?{name:n}:{name:ph||"À définir",ph:true}; }
  return {h:one(m.h,m.hp), a:one(m.a,m.ap)};
}
function standings(S,p){
  var st={}; teamList(S).filter(function(t){return t.poule===p;}).forEach(function(t){ st[t.id]={id:t.id,mj:0,v:0,d:0,pts:0,bp:0,bc:0}; });
  var games=mList(S,"poule").filter(function(m){ return done(m)&&st[m.h]&&st[m.a]; });
  games.forEach(function(m){ var H=st[m.h],A=st[m.a];
    H.mj++;A.mj++;H.bp+=m.hs;H.bc+=m.as;A.bp+=m.as;A.bc+=m.hs;
    if(m.hs>m.as){H.v++;A.d++;H.pts+=2;A.pts+=1;} else if(m.as>m.hs){A.v++;H.d++;A.pts+=2;H.pts+=1;} else {H.pts+=1;A.pts+=1;} });
  var list=Object.keys(st).map(function(k){var x=st[k];x.diff=x.bp-x.bc;return x;});
  // Règlement : points, puis 1) confrontations directes 2) différence 3) points marqués
  list.sort(function(x,y){return y.pts-x.pts;});
  var out=[],i=0;
  while(i<list.length){ var j=i; while(j<list.length&&list[j].pts===list[i].pts) j++;
    var grp=list.slice(i,j);
    if(grp.length>1){ var ids=grp.map(function(x){return x.id;}), h2h={};
      ids.forEach(function(c){h2h[c]={p:0,df:0};});
      games.forEach(function(m){ if(ids.indexOf(m.h)<0||ids.indexOf(m.a)<0) return;
        h2h[m.h].df+=m.hs-m.as; h2h[m.a].df+=m.as-m.hs;
        if(m.hs>m.as){h2h[m.h].p+=2;h2h[m.a].p+=1;} else if(m.as>m.hs){h2h[m.a].p+=2;h2h[m.h].p+=1;} else {h2h[m.h].p++;h2h[m.a].p++;} });
      grp.sort(function(x,y){ return (h2h[y.id].p-h2h[x.id].p)||(h2h[y.id].df-h2h[x.id].df)||(y.diff-x.diff)||(y.bp-x.bp)||(x.id<y.id?-1:1); });

}

    var qs=600,qx=(W-qs)/2,qy=y+140; x.fillStyle="#FFFFFF"; x.fillRect(qx-36,qy-36,qs+72,qs+72);
    if(window.QRCode){ var d=document.createElement("div"); try{ new window.QRCode(d,{text:qrLink(),width:qs,height:qs,colorDark:"#0B2C5B",colorLight:"#FFFFFF",correctLevel:window.QRCode.CorrectLevel.M}); var qc=d.querySelector("canvas"); if(qc) x.drawImage(qc,qx,qy,qs,qs); }catch(e){} }
    x.fillStyle="#F3EBD8"; x.font="800 72px 'Saira Condensed', Impact, sans-serif"; x.fillText("SCANNEZ POUR LES SCORES EN DIRECT",W/2,qy+qs+140);
    x.fillStyle="#A9C7E4"; x.font="500 38px 'Barlow', Arial, sans-serif"; x.fillText("Matchs · Classements · Finales · 1 contre 1",W/2,qy+qs+200);
  }; img.src=LOGO;
}
function downloadPoster(){ var cv=document.getElementById("poster"); if(!cv) return; var a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="Kids_Got_Game_QR.png"; document.body.appendChild(a); a.click(); a.remove(); }

/* ===== Navigation & rendu ===== */
var VIEWS=[["direct","Direct"],["poules","Poules"],["finales","Finales"],["duels","1 contre 1"],["regles","Règles"]];
var EDV=[["table","Table de marque"],["affiche","Affiche QR"]];
function current(){ var h=(location.hash||"").replace("#",""); var all=VIEWS.concat(EDV).map(function(v){return v[0];}); return all.indexOf(h)>=0?h:"direct"; }
function fmtTime(iso){ if(!iso) return "—"; var d=new Date(iso); if(isNaN(d)) return "—"; try{ return d.toLocaleTimeString("fr-FR",{timeZone:"Europe/Paris",hour:"2-digit",minute:"2-digit"}).replace(":","h"); }catch(e){ return ("0"+d.getHours()).slice(-2)+"h"+("0"+d.getMinutes()).slice(-2); } }
function shell(){
  document.getElementById("app").innerHTML='<header class="top"><div class="wrap"><img src="'+LOGO+'" alt="AEB Bagnolet"><div class="brand"><h1>Kids Got Game</h1><p>Tournoi U13 · AEB Bagnolet · 31 octobre 2026</p></div><div class="stamp" id="stamp"></div></div>'+
    '<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav></header><main class="wrap"><div class="banner" id="diag" hidden></div><div class="view" id="view"></div></main>'+
    '<footer class="foot">Club AEB Bagnolet · Les scores se mettent à jour tout seuls · <a href="#table">Table de marque</a></footer><div id="bar"></div><div id="toastbox"></div>';
}
function renderStamp(){
  var el=document.getElementById("stamp"); if(!el) return;
  var lab=conn==="live"?'<span class="dot ok"></span>En direct':conn==="off"?'<span class="dot off"></span>Reconnexion…':'<span class="dot"></span>Connexion…';
  el.innerHTML=lab+'<b>'+fmtTime(state.updated)+'</b>';
  var d=document.getElementById("diag"); if(d){ d.hidden=!(conn==="off"&&lastErr); d.textContent=lastErr?"Diagnostic : "+lastErr:""; }
}
function render(){
  var cur=current(),tabs=VIEWS.concat(isAdmin?EDV:[]);
  document.getElementById("tabs").innerHTML=tabs.map(function(v){var ed=EDV.some(function(e){return e[0]===v[0];});return '<a href="#'+v[0]+'"'+(ed?' class="ed"':'')+(v[0]===cur?' aria-current="page"':'')+'>'+v[1]+'</a>';}).join("");
  var S=state,h;
  switch(cur){ case "poules":h=vPoules(S);break; case "finales":h=vFinales(S);break; case "duels":h=vDuels(S);break; case "regles":h=vRegles();break;
    case "table":h=vTable();break; case "affiche":h=vAffiche();break; default:h=vDirect(S); }
  var y=window.scrollY; document.getElementById("view").innerHTML=h; if(cur==="table") window.scrollTo(0,y);
  if(cur==="affiche") drawPoster();
  renderStamp(); renderBar();
}
var rT=null; function scheduleRender(){ clearTimeout(rT); rT=setTimeout(function(){ if(current()==="table"&&isAdmin) refreshAdmin(); else render(); renderStamp(); },120); }
function refreshAdmin(){
  var act=document.activeElement, view=document.getElementById("view");
  if(act&&view.contains(act)&&act.matches("input,select")){
    // quelqu'un tape : on ne met à jour que les cartes de match qui ne sont pas en cours d'édition
    Object.keys(draft.matches).forEach(function(id){ var el=document.getElementById("ac-"+id); if(el&&!el.contains(act)) el.outerHTML=acardHTML(id); });
    return;
  }
  render();
}
function renderBar(){
  var b=document.getElementById("bar"); if(!b) return;
  if(!isAdmin||current()!=="table"){ b.innerHTML=""; return; }
  var n=Object.keys(pending).length,msg,cls="";
  if(saveState==="error"){ msg="Pas enregistré : vérifiez le Wi-Fi ou la 4G. Nouvel essai automatique…"; cls=" err"; }
  else if(n||saving) msg="Enregistrement…";
  else msg="✓ Tout est enregistré et visible par le public";
  b.innerHTML='<div class="pubbar'+cls+'"><div class="wrap"><span class="msg" role="status">'+msg+'</span>'+(saveState==="error"?'<button class="btn pri" data-act="retry">Réessayer</button>':'')+'</div></div>';
}
function toast(t){ var tb=document.getElementById("toastbox"); if(!tb) return; tb.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>'; clearTimeout(toast._t); toast._t=setTimeout(function(){tb.innerHTML="";},3200); }

/* ===== Données ⇄ Supabase ===== */
function keyVal(S,k){ if(k.indexOf("match:")===0) return S.matches[k.slice(6)]; if(k.indexOf("equipe:")===0) return S.teams[k.slice(7)]; if(k==="link") return S.link; }
function setKey(S,k,v){
  if(k.indexOf("match:")===0){ if(v==null) delete S.matches[k.slice(6)]; else S.matches[k.slice(6)]=v; }
  else if(k.indexOf("equipe:")===0){ if(v==null) delete S.teams[k.slice(7)]; else S.teams[k.slice(7)]=v; }
  else if(k==="link") S.link=v==null?"":v;
  else if(S.legacy){ if(v==null) delete S.legacy[k]; else S.legacy[k]=v; } // anciennes lignes (team:A1, m:p1)
}
function cp(v){ return v==null?v:JSON.parse(JSON.stringify(v)); }
function applyRow(row){ setKey(state,row.cle,row.valeur); if(!pending[row.cle]) setKey(draft,row.cle,cp(row.valeur)); if(row.updated_at&&(!state.updated||new Date(row.updated_at)>new Date(state.updated))) state.updated=row.updated_at; }
function removeRow(cle){ setKey(state,cle,null); if(!pending[cle]) setKey(draft,cle,null); }
function loadAll(){
  if(!sb) return Promise.resolve();
  return sb.from("kgg").select("cle,valeur,updated_at").then(function(res){
    if(res.error){ conn="off"; lastErr="Lecture des scores impossible : "+(res.error.message||res.error.code||"erreur inconnue"); renderStamp(); return; }
    lastErr="";
    var keep={}; Object.keys(pending).forEach(function(k){ keep[k]=cp(keyVal(draft,k)); });
    state={teams:{},matches:{},link:"",updated:null,legacy:{}}; draft={teams:{},matches:{},link:"",updated:null,legacy:{}};
    res.data.forEach(applyRow);
    Object.keys(keep).forEach(function(k){ setKey(draft,k,keep[k]); });
    scheduleRender();
  });
}
var channel=null;
function subscribe(){
  if(!sb) return; if(channel){ sb.removeChannel(channel); channel=null; }
  channel=sb.channel("kgg-live").on("postgres_changes",{event:"*",schema:"public",table:"kgg"},function(p){
    if(p.eventType==="DELETE"){ if(p.old&&p.old.cle) removeRow(p.old.cle); } else if(p.new) applyRow(p.new);
    scheduleRender();
  }).subscribe(function(status,err){
    if(status==="SUBSCRIBED"){ conn="live"; loadAll(); }
    else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){ conn="off"; if(!lastErr) lastErr="Temps réel indisponible ("+status+")"+(err&&err.message?" : "+err.message:""); }
    renderStamp();
  });
}
function markPending(k){ pending[k]=true; saveState="idle"; clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); renderBar(); var el=k.indexOf("match:")===0&&document.getElementById("ac-"+k.slice(6)); if(el) el.classList.add("dirty"); }
function flush(){
  if(saving){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,400); return; }
  var keys=Object.keys(pending); if(!keys.length||!sb) return;
  var snap={}; keys.forEach(function(k){ snap[k]=JSON.stringify(keyVal(draft,k)==null?null:keyVal(draft,k)); });
  var ups=[],dels=[]; keys.forEach(function(k){ var v=keyVal(draft,k); if(v==null) dels.push(k); else ups.push({cle:k,valeur:v}); });
  saving=true; renderBar();
  var p1=ups.length?sb.from("kgg").upsert(ups,{onConflict:"cle"}):Promise.resolve({});
  var p2=dels.length?sb.from("kgg").delete().in("cle",dels):Promise.resolve({});
  Promise.all([p1,p2]).then(function(rs){
    saving=false; var err=rs[0].error||rs[1].error;
    if(err){ saveState="error"; console.error(err); renderBar(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,5000); return; }
    keys.forEach(function(k){ var now=JSON.stringify(keyVal(draft,k)==null?null:keyVal(draft,k)); if(now===snap[k]){ delete pending[k]; setKey(state,k,cp(keyVal(draft,k))); } });
    state.updated=new Date().toISOString(); saveState="ok";
    Object.keys(draft.matches).forEach(function(id){ var el=document.getElementById("ac-"+id); if(el) el.classList.toggle("dirty",!!pending["match:"+id]); });
    renderBar(); renderStamp();
    if(Object.keys(pending).length){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,300); }
  }).catch(function(e){ saving=false; saveState="error"; console.error(e); renderBar(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,5000); });
}
function checkAdmin(){
  adminChecked=false; isAdmin=false;
  if(!session){ adminChecked=true; render(); return; }
  sb.from("kgg_admins").select("email").limit(1).then(function(r){ isAdmin=!r.error&&r.data&&r.data.length>0; adminChecked=true; render(); });
}

/* ===== Actions de la table de marque ===== */
function mset(id,f,v){ var m=draft.matches[id]=Object.assign({},draft.matches[id]||{}); if(v===""||v==null) delete m[f]; else m[f]=v; markPending("match:"+id); return m; }
function tset(id,f,v){ var t=draft.teams[id]=Object.assign({},draft.teams[id]||{}); t[f]=v; markPending("equipe:"+id); }
function rerenderCard(id){ var el=document.getElementById("ac-"+id); if(el) el.outerHTML=acardHTML(id); }
function rerenderAllCards(except){ Object.keys(draft.matches).forEach(function(id){ var el=document.getElementById("ac-"+id); if(el&&!(except&&el.contains(except))) el.outerHTML=acardHTML(id); }); }
function setScore(id,k,v){ var m=mset(id,k==="h"?"hs":"as",v); if((!m.s||m.s==="av")&&v!=null) mset(id,"s","live"); }
function loadOfficial(){
  var legacy=draft.legacy||{}, o=Date.now();
  OFFICIAL.teams.forEach(function(t,i){ var old=legacy["team:"+t[0]]; draft.teams[t[0]]={nom:(typeof old==="string"?old:""),poule:t[1],o:i}; markPending("equipe:"+t[0]); });
  OFFICIAL.matches.forEach(function(r,i){ var m=Object.assign({t:r[1],c:r[2],k:r[3],o:o+i},r[4]?{l:r[4]}:{},r[5]); Object.keys(m).forEach(function(k){ if(m[k]==="") delete m[k]; });
    var old=legacy["m:"+r[0]]; if(old&&typeof old==="object"){ if(old.h!=null) m.hs=old.h; if(old.a!=null) m.as=old.a; if(old.s) m.s=old.s; }
    draft.matches[r[0]]=m; markPending("match:"+r[0]); });
  render(); toast("Programme officiel chargé");
}
function genPoolMatches(){
  var n=0,o=Date.now();
  poulesOf(draft).forEach(function(p){
    var ts=teamList(draft).filter(function(t){return t.poule===p;});
    for(var i=0;i<ts.length;i++) for(var j=i+1;j<ts.length;j++){
      var a=ts[i].id,b=ts[j].id, exists=Object.keys(draft.matches).some(function(k){ var m=draft.matches[k]; return m.k==="poule"&&((m.h===a&&m.a===b)||(m.h===b&&m.a===a)); });
      if(!exists){ var id=uid("m"); draft.matches[id]={k:"poule",h:a,a:b,o:o+n}; markPending("match:"+id); n++; }
    }
  });
  render(); toast(n?n+" match"+(n>1?"s":"")+" ajouté"+(n>1?"s":""):"Tous les matchs de poule existent déjà");
}

document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]"); if(!b) return; var act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(act==="add"){ var k=b.getAttribute("data-k"),m=draft.matches[id]||{},f=k==="h"?"hs":"as",o=k==="h"?"as":"hs"; setScore(id,k,Math.max(0,(m[f]||0)+parseInt(b.getAttribute("data-v"),10))); if(draft.matches[id][o]==null) mset(id,o,0); rerenderCard(id); }
  else if(act==="st"){ var v=b.getAttribute("data-v"); mset(id,"s",v); if(v!=="av"){ if(draft.matches[id].hs==null) mset(id,"hs",0); if(draft.matches[id].as==null) mset(id,"as",0); } rerenderAllCards(); }
  else if(act==="edit"){ openEdit[id]=!openEdit[id]; delete confirmDel[id]; rerenderCard(id); }
  else if(act==="del"){ confirmDel[id]=1; rerenderCard(id); }
  else if(act==="delno"){ delete confirmDel[id]; rerenderCard(id); }
  else if(act==="delyes"){ delete draft.matches[id]; delete confirmDel[id]; delete openEdit[id]; markPending("match:"+id); var el=document.getElementById("ac-"+id); if(el) el.remove(); toast("Match supprimé"); }
  else if(act==="madd"){ var k2=b.getAttribute("data-k"), nid=uid("m"); draft.matches[nid]={k:k2,o:Date.now()}; openEdit[nid]=1; markPending("match:"+nid); render(); var ne=document.getElementById("ac-"+nid); if(ne){ ne.scrollIntoView({block:"center"}); var f=ne.querySelector("input,select"); if(f) f.focus(); } }
  else if(act==="tadd"){ var ts=teamList(draft), tid=uid("t"); draft.teams[tid]={nom:"",poule:ts.length?ts[ts.length-1].poule:"A",o:Date.now()}; markPending("equipe:"+tid); render(); var ti=document.querySelector('input[data-tf="nom"][data-id="'+tid+'"]'); if(ti) ti.focus(); }
  else if(act==="tdel"){ confirmDel["t"+id]=1; render(); }
  else if(act==="tdelno"){ delete confirmDel["t"+id]; render(); }
  else if(act==="tdelyes"){ delete confirmDel["t"+id]; delete draft.teams[id]; markPending("equipe:"+id);
    Object.keys(draft.matches).forEach(function(mid){ var m=draft.matches[mid]; if(m.h===id) mset(mid,"h",null); if(m.a===id) mset(mid,"a",null); }); render(); toast("Équipe retirée"); }
  else if(act==="gen") genPoolMatches();
  else if(act==="official") loadOfficial();
  else if(act==="retry") flush();
  else if(act==="reset1"){ document.getElementById("resetbox").innerHTML='<div class="confirm"><b style="flex:1">Effacer tous les scores ?</b><button class="btn" data-act="reset0">Garder</button><button class="btn dng" data-act="reset2">Oui, effacer</button></div>'; }
  else if(act==="reset0") render();
  else if(act==="reset2"){ Object.keys(draft.matches).forEach(function(mid){ ["hs","as","s"].forEach(function(f){ mset(mid,f,null); }); }); render(); toast("Scores effacés"); }
  else if(act==="logout") sb.auth.signOut().then(function(){ location.hash="#direct"; });
  else if(act==="dl") downloadPoster();
});
document.addEventListener("submit",function(ev){
  if(ev.target.id!=="loginform") return; ev.preventDefault();
  var btn=document.getElementById("lg-btn"); btn.disabled=true; btn.textContent="Connexion…";
  sb.auth.signInWithPassword({email:document.getElementById("lg-mail").value.trim(),password:document.getElementById("lg-pass").value}).then(function(r){
    if(r.error){ var m=(r.error.message||"")+""; vTable.msg=/invalid login/i.test(m)?"E-mail ou mot de passe incorrect.":/not confirmed/i.test(m)?"Ce compte n'est pas confirmé : dans Supabase → Authentication → Users, confirmez l'utilisateur.":/fetch|network|failed/i.test(m)?"Impossible de joindre Supabase : vérifiez la connexion internet et config.js.":"Erreur Supabase : "+m; render(); } else vTable.msg="";
  });
});
document.addEventListener("input",function(ev){
  var t=ev.target; if(!isAdmin) return;
  if(t.matches("input[data-score]")){ var raw=t.value.replace(/[^0-9]/g,""); setScore(t.dataset.score,t.dataset.k,raw===""?null:parseInt(raw,10)); }
  else if(t.matches("input[data-mf]")){ mset(t.dataset.id,t.dataset.mf,t.value); }
  else if(t.matches("input[data-tf]")){ tset(t.dataset.id,t.dataset.tf,t.value); rerenderAllCards(t); }
  else if(t.matches("input[data-link]")){ draft.link=t.value.trim(); markPending("link"); }
});
document.addEventListener("change",function(ev){
  var t=ev.target; if(!isAdmin) return;
  if(t.matches("select[data-mf]")){ mset(t.dataset.id,t.dataset.mf,t.value||null); rerenderCard(t.dataset.id); }
  else if(t.matches("select[data-tf]")){ tset(t.dataset.id,t.dataset.tf,t.value); render(); }
  else if(t.matches("input[data-score]")||t.matches("input[data-mf]")){ var id=t.dataset.score||t.dataset.id; if(t.dataset.mf==="t"){ render(); } else rerenderCard(id); }
});
window.addEventListener("hashchange",render);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"){ if(conn!=="live") subscribe(); else loadAll(); } });
window.addEventListener("online",function(){ subscribe(); if(Object.keys(pending).length) flush(); });
window.addEventListener("beforeunload",function(e){ if(Object.keys(pending).length){ e.preventDefault(); e.returnValue=""; } });

/* ===== Démarrage ===== */
shell(); render();
var CFG=window.KGG_CONFIG||{};
if(window.supabase && CFG.url && CFG.anonKey && CFG.anonKey.indexOf("COLLEZ")<0){
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{realtime:{params:{eventsPerSecond:10}}});
  loadAll(); subscribe();
  setInterval(loadAll,60000); // filet de sécurité si un téléphone perd la connexion en silence
  sb.auth.getSession().then(function(r){ session=r.data.session; checkAdmin(); });
  sb.auth.onAuthStateChange(function(evt,s){ var had=!!session; session=s; if(evt==="SIGNED_IN"&&!had) checkAdmin(); else if(evt==="SIGNED_OUT"){ isAdmin=false; render(); } });
} else { conn="off"; lastErr=window.supabase?(window.KGG_CONFIG?"Clés Supabase non renseignées dans config.js.":"Le fichier config.js est introuvable : envoyez-le sur GitHub à côté de index.html."):"La bibliothèque Supabase ne s'est pas chargée (connexion internet ou bloqueur de publicité)."; renderStamp(); }
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ if(current()==="affiche") drawPoster(); });
})();
</script>
